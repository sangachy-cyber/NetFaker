[project]
name = "netfaker"
version = "0.1.0"
authors = [
    { name = "NetFaker Team", email = "team@netfaker.io" },
]
description = "网络仿真参数生成工具"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "loguru>=0.7.3",
    "pyarrow>=23.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.0.0",
    "holowan @ file://${PROJECT_ROOT}/third_party/holowan_python_api-2908",
]

[project.urls]
"Homepage" = "https://github.com/your-org/netfaker"
"Bug Tracker" = "https://github.com/your-org/netfaker/issues"

[project.scripts]
netfaker = "scripts.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E", "W", "F", "I", "B", "C4", "SIM", "C901"]
lint.ignore = ["E501"]  # 由 line-length 控制
lint.exclude = ["third_party/**", "third_party/"]
lint.mccabe.max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.uv]
# version = "0.1.0"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netfaker"
version = "0.1.0"
description = "Network trajectory generation system"
authors = [
    { name = "NetFaker Developers" },
]
dependencies = [
    "numpy>=2.0.2",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.6.1",
    "tqdm>=4.67.1",
    "jinja2>=3.0.0",
    "torch==2.1.0",
    "diffusers==0.29.2",
    "matplotlib>=3.9.4",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "ruff>=0.1.0",
]

[tool.uv]
index-url = "https://pypi.douban.com/simple"